[project]
name = "art-build-failures"
version = "0.1.0"
description = "Dashboard for visualizing Konflux build failure data from Redis"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "Flask[async]",
    "gunicorn",
    "redis",
    "rh-art-tools @ git+https://github.com/openshift-eng/art-tools.git@main",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E722", "E501"]

[tool.ruff.format]
quote-style = "single"
